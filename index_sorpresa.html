<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Para Ti</title><style>body{margin:0;overflow:hidden;font-family:Georgia;background:linear-gradient(#7ec8ff,#fff6b0);display:flex;justify-content:center;align-items:center;height:100vh}.card{background:#ffffffdd;padding:30px;border-radius:20px;max-width:700px;text-align:center;z-index:2}h1{color:#c79a00}.type{white-space:pre-wrap}.heart{font-size:42px;animation:p 1s infinite}@keyframes p{50%{transform:scale(1.2)}}.petal,.heartf{position:fixed;top:-30px;animation:fall linear forwards}.petal{font-size:28px}.heartf{font-size:20px}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}</style></head><body><div class='card'><h1>🌼 Flores Amarillas Para Ti 🌼</h1><div id='t' class='type'></div><div class='heart'>❤️</div></div><script>let txt='Dicen que las flores amarillas representan esperanza, amor y un futuro juntos.\n\nHoy quiero regalarte estas flores para recordarte que eres la persona más especial de mi vida.\n\nGracias por existir, por tu sonrisa y por hacer felices mis días.\n\nTe amo con todo mi corazón. 💛';let i=0,e=document.getElementById('t');(function f(){if(i<txt.length){e.textContent+=txt[i++];setTimeout(f,35)}})();function c(s,k){let d=document.createElement('div');d.className=k;d.textContent=s;d.style.left=Math.random()*100+'vw';d.style.animationDuration=(4+Math.random()*5)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),9000)}setInterval(()=>c('🌼','petal'),180);setInterval(()=>c('💛','heartf'),350);</script></body></html>
