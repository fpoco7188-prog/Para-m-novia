<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Para Mi Amor</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(#87CEEB,#FFF9C4);font-family:Arial}.c{background:#ffffffcc;padding:30px;border-radius:20px;text-align:center}h1{color:#d4a000}.heart{font-size:40px;animation:b 1s infinite}@keyframes b{50%{transform:scale(1.2)}}.f{position:fixed;width:20px;height:20px;background:#FFD700;border-radius:50%;opacity:.7;animation:fall linear infinite}</style></head><body><div class='c'><h1>🌼 Para Mi Amor 🌼</h1><p>Las flores amarillas son un pequeño detalle para recordarte lo especial que eres.</p><p>Gracias por iluminar mi vida con tu sonrisa.</p><p><b>Te amo hoy, mañana y siempre. 💛</b></p><div class='heart'>❤️</div></div><script>function x(){let d=document.createElement('div');d.className='f';d.style.left=Math.random()*100+'vw';d.style.top='-20px';d.style.animation='fall '+(4+Math.random()*5)+'s linear';document.body.appendChild(d);let i=setInterval(()=>{d.style.top=(parseFloat(d.style.top)+2)+'px';if(parseFloat(d.style.top)>innerHeight){clearInterval(i);d.remove()}},16)}setInterval(x,250)</script></body></html>
